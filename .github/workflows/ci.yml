name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gxp_qlcl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gxp_qlcl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gxp_qlcl_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tracked-file hygiene policy
        run: |
          test ! -d legacy
          python tools/check_repo_hygiene.py

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.dev.lock.txt

      - name: Validate Alembic upgrade
        run: python -m alembic upgrade head

      - name: Validate PostgreSQL migration downgrade and re-upgrade
        env:
          A3_POSTGRES_MIGRATION_INTEGRATION: "1"
          A3_DISPOSABLE_POSTGRES_DATABASE: gxp_qlcl_test
        run: python -m pytest tests/test_a3_capa_incoming_reference_postgres.py tests/test_a5_change_request_postgres.py -q

      - name: Validate staging lineage with disposable PostgreSQL
        env:
          GXP_STAGING_LINEAGE_POSTGRES_INTEGRATION: "1"
          GXP_STAGING_LINEAGE_DISPOSABLE_DATABASE: gxp_qlcl_test
        run: python -m pytest tests/test_storage_staging_lineage_postgres.py -q -p no:cacheprovider

      - name: Run backend tests
        run: python -m pytest -q

  b6-postgres-integration:
    # Recovery-only, disposable PostgreSQL coverage. Never connects to a VM.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/recovery/b6-') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gxp_b6_ci_admin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gxp_b6_ci_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.dev.lock.txt

      - name: Create disposable B6 PostgreSQL databases
        env:
          B6_CI_ADMIN_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gxp_b6_ci_admin
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine

          engine = create_engine(os.environ["B6_CI_ADMIN_URL"], isolation_level="AUTOCOMMIT")
          try:
              with engine.connect() as connection:
                  for name in ("gxp_b6g_test_ci", "gxp_b6h_test_ci", "gxp_b6j_test_ci", "gxp_b6c_test_ci"):
                      assert name.startswith(("gxp_b6g_test_", "gxp_b6h_test_", "gxp_b6j_test_", "gxp_b6c_test_"))
                      connection.exec_driver_sql(f'CREATE DATABASE "{name}"')
          finally:
              engine.dispose()
          PY

      - name: B6G isolated schema expand and downgrade regression
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gxp_b6g_test_ci
          B6G_POSTGRES_INTEGRATION: "1"
        run: |
          python -m alembic upgrade 20260915_0016
          python -m pytest tests/test_b6g_schema_expand_foundation_postgres.py -q -p no:cacheprovider

      - name: B6H isolated canonical-state exporter regression
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gxp_b6h_test_ci
          B6H_POSTGRES_INTEGRATION: "1"
        run: |
          python -m alembic upgrade 20260929_0017
          python -m pytest tests/test_production_line_population_b6h_postgres.py -q -p no:cacheprovider

      - name: B6J isolated planner and guarded-writer regression
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gxp_b6j_test_ci
          B6J_POSTGRES_INTEGRATION: "1"
        run: |
          python -m alembic upgrade 20260929_0017
          python -m pytest tests/test_production_line_population_b6j_postgres.py -q -p no:cacheprovider

      - name: B6 revision 0022 exact-provenance export, plan, rollback and disposable apply
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gxp_b6c_test_ci
          B6_0022_COMPAT_INTEGRATION: "1"
        run: |
          python -m alembic upgrade 20260929_0017
          python -m pytest tests/test_b6_0022_schema_compat_postgres.py -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tracked-file hygiene
        run: python tools/check_repo_hygiene.py

      - name: Assert fresh checkout excludes production legacy artifacts
        run: |
          test ! -d legacy

      - name: Install pip-tools
        run: python -m pip install pip-tools==7.6.1

      - name: Verify backend runtime lock freshness
        run: |
          python -m piptools compile --quiet --strip-extras --output-file backend/requirements.runtime.lock.txt backend/requirements.runtime.txt
          git diff --exit-code -- backend/requirements.runtime.lock.txt

      - name: Verify backend VM runtime lock freshness
        run: |
          python -m piptools compile --quiet --strip-extras --output-file backend/requirements.runtime.vm.lock.txt backend/requirements.runtime.vm.txt
          git diff --exit-code -- backend/requirements.runtime.vm.lock.txt

      - name: Verify backend dev lock freshness
        run: |
          python -m piptools compile --quiet --strip-extras --output-file backend/requirements.dev.lock.txt backend/requirements.dev.txt
          git diff --exit-code -- backend/requirements.dev.lock.txt

      - name: Verify backend VM runtime lock installs with auth transport imports
        run: |
          python -m venv .venv-vm-runtime-lock
          . .venv-vm-runtime-lock/bin/activate
          python -m pip install --no-cache-dir -r backend/requirements.runtime.vm.lock.txt
          python - <<'PY'
          import requests
          from google.auth.transport.requests import Request as GoogleAuthRequest
          from google.oauth2 import id_token
          
          assert requests.__version__
          assert GoogleAuthRequest is not None
          assert id_token is not None
          PY

  cross-head-integration:
    # Explicitly pinned two-HEAD gate. Never merges/rebases/deploys either
    # branch. Runs only on backend-owner branch push, in a disposable runner.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/frontend-backend-20261009' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gxp_qlcl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gxp_qlcl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gxp_qlcl_test
      GXP_CROSS_HEAD_DISPOSABLE_GATE: "1"
    steps:
      - name: Checkout combined candidate with full Git ancestry (no credentials retained)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove integrated parents and byte-identical reviewed frontend subtree
        run: |
          set -euo pipefail
          BACKEND="b5e0ebd7c5e047c4cdc8c7cdc206872b8b68cb14"
          FRONTEND="50576b0b383161e26e27b6cdc4a1a469aff1ae17"
          test "${GITHUB_REF}" = "refs/heads/integration/frontend-backend-20261009"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${BACKEND}" HEAD
          git merge-base --is-ancestor "${FRONTEND}" HEAD
          test "$(git rev-parse HEAD:frontend)" = "$(git rev-parse "${FRONTEND}:frontend")"
          git diff --exit-code "${FRONTEND}" HEAD -- frontend
          git diff --exit-code HEAD -- frontend
          test -f frontend/src/lib/api.ts


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.dev.lock.txt

      - name: Migrate disposable local PostgreSQL
        run: python -m alembic upgrade head

      - name: Declare runner-local synthetic fixture path
        run: echo "GXP_CROSS_HEAD_FIXTURE_JSON=${RUNNER_TEMP}/gxp-cross-head-fixture.json" >> "${GITHUB_ENV}"

      - name: Start isolated synthetic backend fixture
        run: |
          python -m uvicorn tools.cross_head_fixture_app:app --host 127.0.0.1 --port 8000 \
            > "${RUNNER_TEMP}/gxp-cross-head-server.log" 2>&1 &
          echo "GXP_CROSS_HEAD_SERVER_PID=$!" >> "${GITHUB_ENV}"
          READY=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "${READY}" != "1" ] || [ ! -f "${GXP_CROSS_HEAD_FIXTURE_JSON}" ]; then
            echo "Disposable cross-head backend fixture failed to start."
            exit 1
          fi

      - name: Install exact frontend commit dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run actual frontend API client against actual backend HTTP
        working-directory: frontend
        run: |
          cp ../tests/cross_head_frontend_api.test.ts src/lib/cross_head_api_ci.test.ts
          trap 'rm -f src/lib/cross_head_api_ci.test.ts' EXIT
          pnpm exec vitest run src/lib/cross_head_api_ci.test.ts --reporter=verbose

      - name: Install pinned disposable browser driver and Chromium
        run: |
          echo "GXP_CROSS_HEAD_PW_DIR=${RUNNER_TEMP}/gxp-browser-driver" >> "${GITHUB_ENV}"
          echo "GXP_CROSS_HEAD_SCREENSHOTS=${GITHUB_WORKSPACE}/cross-head-screenshots" >> "${GITHUB_ENV}"
          npm install --no-save --prefix "${RUNNER_TEMP}/gxp-browser-driver" playwright@1.56.1
          "${RUNNER_TEMP}/gxp-browser-driver/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start loopback-only Codex frontend staging preview
        working-directory: frontend
        run: |
          # A runner-only reverse-proxy simulation: the real FastAPI routes
          # lack the /api prefix; do not modify the pinned Codex source.
          cat > cross-head.vite.config.mjs <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          export default defineConfig({
            plugins: [react()],
            server: {
              host: "127.0.0.1", port: 4173, strictPort: true,
              proxy: {
                "/api": {
                  target: "http://127.0.0.1:8000",
                  changeOrigin: false,
                  rewrite: path => path.replace(new RegExp("^/api(?=/|$)"), ""),
                },
              },
            },
          });
          EOF
          pnpm exec vite --config cross-head.vite.config.mjs --host 127.0.0.1 --port 4173 --strictPort \
            > "${RUNNER_TEMP}/gxp-cross-head-frontend.log" 2>&1 &
          echo "GXP_CROSS_HEAD_FRONTEND_PID=$!" >> "${GITHUB_ENV}"
          READY=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/search >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "${READY}" != "1" ]; then
            echo "Disposable loopback UI failed to boot."
            exit 1
          fi
          # Verify frontend-to-backend proxy before launching Chromium.
          curl --fail --silent http://127.0.0.1:4173/api/app/status \
            | python -c 'import json,sys; assert json.load(sys.stdin)["auth_mode"] == "header_stub"'

      - name: Run real Chromium navigation on three screen sizes
        run: node tests/cross_head_browser.mjs

      - name: Archive synthetic-only browser QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-head-browser-evidence
          path: cross-head-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify integrated frontend remained byte-identical throughout
        run: |
          set -euo pipefail
          FRONTEND="50576b0b383161e26e27b6cdc4a1a469aff1ae17"
          test "$(git rev-parse HEAD:frontend)" = "$(git rev-parse "${FRONTEND}:frontend")"
          git diff --exit-code "${FRONTEND}" HEAD -- frontend
          git diff --exit-code -- frontend
          test ! -f frontend/src/lib/cross_head_api_ci.test.ts

      - name: Terminate CI-only fixture process
        if: always()
        run: |
          if [ -n "${GXP_CROSS_HEAD_SERVER_PID:-}" ]; then
            kill "${GXP_CROSS_HEAD_SERVER_PID}" 2>/dev/null || true
          fi
          if [ -n "${GXP_CROSS_HEAD_FRONTEND_PID:-}" ]; then
            kill "${GXP_CROSS_HEAD_FRONTEND_PID}" 2>/dev/null || true
          fi
          rm -f frontend/cross-head.vite.config.mjs frontend/src/lib/cross_head_api_ci.test.ts

