name: First Case real HTTP PostgreSQL Chromium integration

on:
  pull_request:
    branches: [main]
    paths:
      - tests/test_catalog_chromium_real_postgres.py
      - tests/test_catalog_first_case_http_postgres.py
      - frontend/catalog-journey-browser-fixture.html
      - frontend/src/qa/initialCaseBrowserFixture.tsx
      - frontend/src/features/search/CompanySiteCreationDialog.tsx
      - frontend/src/features/search/PhysicalLineCreationDialog.tsx
      - frontend/src/features/search/InitialCaseCreationDialog.tsx
      - frontend/src/pages/CaseDirectOpen.tsx
      - frontend/vite.config.ts
      - backend/app/api/routers/catalog.py
      - backend/app/api/routers/workflow.py
      - backend/app/services/catalog.py
      - backend/app/services/workflow.py
      - .github/workflows/catalog-real-postgres-chromium.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gxp_qlcl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d gxp_qlcl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gxp_qlcl_test
      GXP_CANONICAL_WORKFLOW_POSTGRES: "1"
      GXP_CATALOG_REAL_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked backend and Playwright dependencies
        run: |
          python -m pip install -r backend/requirements.dev.lock.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Start dev-only Vite fixture
        run: |
          set -euo pipefail
          cd frontend
          pnpm dev --host 127.0.0.1 > /tmp/catalog-real-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/catalog-journey-browser-fixture.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/catalog-real-vite.log
          exit 1
      - name: Run real Chromium → Vite → FastAPI → disposable PostgreSQL
        run: |
          test "${DATABASE_URL}" = "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gxp_qlcl_test"
          python -m pytest tests/test_catalog_chromium_real_postgres.py -q -p no:cacheprovider -rs
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-real-postgres-chromium-failure
          path: |
            browser-evidence/
            /tmp/catalog-real-vite.log
          if-no-files-found: ignore
